# Physics engine
physics:
  sample_rate: 4096
  duration: 0.0625
  scale: 1e-21

# Target event (Extrinsic parameters)
event:
  fixed_ra: 1.5
  fixed_dec: -0.5
  fixed_psi: 0.8
  fixed_gps: 1420950000.0

# Prior boundaries (Intrinsic parameters)
priors:
  mass_min: 50.0
  mass_max: 100.0
  spin_min: 0.5    
  spin_max: 0.99 
  amp_min: -5.0
  amp_max: 5.0

# Neural architecture
model:
  param_dim: 10
  context_dim: 64
  hidden_features: 128
  num_transforms: 5
  embedding_net:
    in_channels: 1
    channels: [16, 32, 64]
    kernel_size: 9
    padding: 4
    stride: 1
    dilation: 1
    pool_size: 2
    pool_stride: 2
    pool_padding: 0
    pool_dilation: 1
    use_dropout: false
    dropout_rate: 0.1

# Training hyperparameters
training:
  epochs: 200
  batch_size: 64
  lr_stage_1: 0.0005
  lr_stage_2: 0.00005
  epoch_switch: 100
  weight_decay: 0.01
  num_train_samples: 32768
  num_val_samples: 8192
  save_dir: "saved_models/best_ringdown_model.pth"
  max_runtime_minutes: 120

# Offline dataset paths
data:
  train_file: "datasets/train_waveforms.hdf5"
  val_file: "datasets/val_waveforms.hdf5"
  test_file: "datasets/test_waveforms.hdf5"

# Single event inference settings
inference:
  num_samples: 20000

# Pipeline diagnostics
diagnostics:
  compute_snr: true 
  save_history_data: true
  plot_loss_curve: true
  plot_snr_distribution: true
  pp_plot:
    num_test_events: 1000
    num_samples_per_event: 10000
    max_runtime_minutes: 180
