# Physics engine settings
physics:
  sample_rate: 4096
  duration: 0.0625
  scale: 1e-21

# Target event (Extrinsic parameters)
event:
  fixed_ra: 1.5
  fixed_dec: -0.5
  fixed_psi: 0.8
  fixed_gps: 1420950000.0

# Prior boundaries (Intrinsic parameters)
priors:
  mass_min: 50.0
  mass_max: 100.0
  spin_min: 0.5    
  spin_max: 0.99 
  amp_min: -5.0
  amp_max: 5.0

# Neural architecture
model:
  param_dim: 10
  context_dim: 64
  hidden_features: 128
  num_transforms: 5
  embedding_net:
    in_channels: 1
    channels: [16, 32, 64]
    kernel_size: 9
    padding: 4
    stride: 1
    dilation: 1
    pool_size: 2
    pool_stride: 2
    pool_padding: 0
    pool_dilation: 1

# Training hyperparameters
training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.0005
  num_train_samples: 2048
  num_val_samples: 512
  save_dir: "saved_models/best_ringdown_model.pth"

# Single event inference settings
inference:
  num_samples: 2000

# Pipeline diagnostics
diagnostics:
  compute_snr: true 
  save_history_data: true
  plot_loss_curve: true
  plot_snr_distribution: true
  pp_plot:
    num_test_events: 1000
    num_samples_per_event: 10000
